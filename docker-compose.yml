services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lia_clinic
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis para colas y cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO para almacenamiento de archivos (simula S3)
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lia
      MINIO_ROOT_PASSWORD: lia-clinic-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Mailhog para testing de emails (captura todos los emails enviados)
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI

  # API del backend (NestJS)
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3311:3311"
    environment:
      - NODE_ENV=development
      - API_PORT=3311
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/lia_clinic
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=lia
      - MINIO_SECRET_KEY=lia-clinic-secret
      - MINIO_BUCKET=lia-clinic
      - OIDC_ISSUER=https://your-oidc-provider.com
      - OIDC_CLIENT_ID=your-client-id
      - OIDC_CLIENT_SECRET=your-client-secret
      - OIDC_REDIRECT_URI=https://localhost:3311/auth/callback
      - GOOGLE_CALENDAR_CLIENT_ID=
      - GOOGLE_CALENDAR_CLIENT_SECRET=
      - GOOGLE_CALENDAR_REDIRECT_URI=
      - EMAIL_HOST=mailhog
      - EMAIL_PORT=1025
      - EMAIL_FROM=noreply@liaclinic.local
      - WHATSAPP_API_URL=
      - WHATSAPP_TOKEN=
      - WHATSAPP_PHONE_ID=
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Worker para procesos asincrónicos (notificaciones, sync)
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/lia_clinic
      - REDIS_URL=redis://redis:6379
      - GOOGLE_CALENDAR_CLIENT_ID=
      - GOOGLE_CALENDAR_CLIENT_SECRET=
      - EMAIL_HOST=mailhog
      - EMAIL_PORT=1025
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:
  minio_data:
