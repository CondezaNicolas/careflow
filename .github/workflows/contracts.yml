name: Contract Tests

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/web/tests/contracts/**'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/web/tests/contracts/**'

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run contract tests
        run: npm run test:contracts -w @lia/web
