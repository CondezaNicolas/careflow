version: "3.8"

services:
  # =====================
  # Infrastructure
  # =====================

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lia
      POSTGRES_PASSWORD: lia
      POSTGRES_DB: lia_clinic
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lia"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lia-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lia-network

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lia
      MINIO_ROOT_PASSWORD: lia-clinic-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - lia-network

  # =====================
  # OIDC / Auth
  # =====================

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.2
    command: start-dev --http-relative-path /auth
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: dev-file
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/auth/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - lia-network

  # =====================
  # Application Services
  # =====================

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3311:3311"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://lia:lia@postgres:5433/lia_clinic
      - REDIS_URL=redis://redis:6379
      - OBJECT_STORAGE_ENDPOINT=http://minio:9000
      - OBJECT_STORAGE_ACCESS_KEY=lia
      - OBJECT_STORAGE_SECRET_KEY=lia-clinic-secret
      - OIDC_ISSUER=http://localhost:8080/auth/realms/lia-clinic
      - OIDC_CLIENT_ID=lia-clinic
      - OIDC_CLIENT_SECRET=lia-clinic-secret
      - OIDC_REDIRECT_URI=http://localhost:3311/auth/callback
      - OIDC_AUDIENCE=lia-clinic
      - OIDC_TENANT_CLAIM=tenant_id
      - OIDC_ROLE_CLAIM=role
      - SESSION_COOKIE_NAME=lia_session
      - SESSION_TTL_MINUTES=480
      - ENABLE_REQUEST_LOGGING=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
    command: sh -c "npm run migration:check -w @lia/api && npm run dev -w @lia/api"
    networks:
      - lia-network

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://lia:lia@postgres:5432/lia_clinic
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/worker:/app/apps/worker
      - ./packages:/app/packages
    command: npm run dev -w @lia/worker
    networks:
      - lia-network

volumes:
  postgres_data:
  minio_data:

networks:
  lia-network:
    driver: bridge
