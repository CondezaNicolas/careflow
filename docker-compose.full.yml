version: "3.8"

services:
  # =====================
  # Infrastructure
  # =====================

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lia
      POSTGRES_PASSWORD: lia
      POSTGRES_DB: lia_clinic
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lia"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lia-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lia-network

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lia
      MINIO_ROOT_PASSWORD: lia-clinic-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - lia-network

  # =====================
  # Application Services
  # =====================

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3311:3311"
    environment:
      - NODE_ENV=development
      - API_PORT=3311
      - DATABASE_URL=postgresql://lia:lia@postgres:5432/lia_clinic
      - REDIS_URL=redis://redis:6379
      - ENABLE_REQUEST_LOGGING=true
      - ALLOWED_ORIGINS=http://localhost:3310,http://localhost:3000
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
      - REQUEST_TIMEOUT_MS=30000
      - JWT_SECRET=dev-jwt-secret-please-override-in-production-32ch!
      - JWT_REFRESH_SECRET=dev-refresh-secret-please-override-in-production-32ch!
      - JWT_ACCESS_TTL=15m
      - JWT_REFRESH_TTL=7d
      - SESSION_COOKIE_NAME=lia_session
      - SESSION_SECRET=dev-session-secret-please-override-in-production-32ch!
      - AUTH_DEV_BYPASS=false
      - DEV_LOGIN_ENABLED=false
      - GOOGLE_CALENDAR_CLIENT_ID=
      - GOOGLE_CALENDAR_CLIENT_SECRET=
      - GOOGLE_CALENDAR_REFRESH_TOKEN=
      - GOOGLE_CALENDAR_CALENDAR_ID=
      - EMAIL_PROVIDER_API_KEY=
      - EMAIL_PROVIDER_FROM=noreply@liaclinic.local
      - WHATSAPP_ACCESS_TOKEN=
      - WHATSAPP_PHONE_NUMBER_ID=
      - WHATSAPP_BUSINESS_ACCOUNT_ID=
      - GOOGLE_CALENDAR_MAX_RETRIES=5
      - GOOGLE_CALENDAR_BACKOFF_SECONDS=30
      - NOTIFICATIONS_MAX_RETRIES=4
      - NOTIFICATIONS_BACKOFF_SECONDS=45
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
    command: sh -c "npm run migration:check -w @lia/api && npm run dev -w @lia/api"
    networks:
      - lia-network

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://lia:lia@postgres:5432/lia_clinic
      - REDIS_URL=redis://redis:6379
      - GOOGLE_CALENDAR_MAX_RETRIES=5
      - GOOGLE_CALENDAR_BACKOFF_SECONDS=30
      - NOTIFICATIONS_MAX_RETRIES=4
      - NOTIFICATIONS_BACKOFF_SECONDS=45
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/worker:/app/apps/worker
      - ./packages:/app/packages
    command: npm run dev -w @lia/worker
    networks:
      - lia-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3310:3310"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:3311
      - API_URL=http://api:3311
    depends_on:
      - api
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
    command: npm run dev -w @lia/web
    networks:
      - lia-network

volumes:
  postgres_data:
  minio_data:

networks:
  lia-network:
    driver: bridge
